<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오유금❤️김윤영</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 월별로 묶인 폴라로이드 사진첩. 손글씨 메모, 오른쪽 위에 만난 날과 D+. */
:root {
  --paper: #F1EFF4; --card: #FFFFFF; --ink: #2A2233; --muted: #776E82; --line: #DCD6E3;
  --accent: #C9445F; --accent-soft: #F7DFE5; --shade: rgba(42,34,51,.12); --veil: rgba(20,16,26,.88);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-hand: "Nanum Pen Script", "Gowun Dodum", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #16131A; --card: #221E28; --ink: #EEE9F3; --muted: #A39AAD; --line: #362F3E;
    --accent: #F07D95; --accent-soft: #3B2430; --shade: rgba(0,0,0,.45); --veil: rgba(6,4,9,.94);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }

.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 22px; }
.head h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; margin: 0; text-wrap: balance; }
.head .count { color: var(--muted); margin: 6px 0 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.dday { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.dday .n { font-family: var(--f-hand); font-size: clamp(44px, 9vw, 64px); line-height: .9; color: var(--accent); }
.dday .l { font-size: 13px; color: var(--muted); }
.dday .next { font-size: 12px; color: var(--muted); opacity: .85; }

.month { display: flex; flex-direction: column; gap: 18px; }
.month h2 { margin: 0; display: flex; align-items: baseline; gap: 12px; font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.month h2 small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 26px 20px; }
@media (max-width: 440px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; } }

.print { background: var(--card); padding: 10px 10px 6px; border: 0; text-align: left; box-shadow: 0 1px 2px var(--shade), 0 8px 18px -10px var(--shade); transform: rotate(var(--tilt, 0deg)); transition: transform .2s ease, box-shadow .2s ease; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.print:hover, .print:focus-visible { transform: rotate(0deg) translateY(-3px); box-shadow: 0 2px 4px var(--shade), 0 16px 28px -12px var(--shade); }
.print .ph { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; background: var(--line); overflow: hidden; }
.print img { width: 100%; height: 100%; object-fit: cover; display: block; }
.print .cap { font-family: var(--f-hand); font-size: 21px; line-height: 1.15; min-height: 26px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.print .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 48px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty .big { font-family: var(--f-hand); font-size: 34px; line-height: 1.1; }
.empty p { margin: 0; color: var(--muted); max-width: 44ch; }

.lb { position: fixed; inset: 0; background: var(--veil); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb img { max-width: 100%; max-height: calc(100% - 90px); object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.lb .txt { color: #fff; text-align: center; }
.lb .txt .c { font-family: var(--f-hand); font-size: 28px; line-height: 1.2; }
.lb .txt .d { font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums; }
.lb .nav, .lb .x { position: absolute; border: 0; background: rgba(255,255,255,.14); color: #fff; border-radius: 50%; width: 44px; height: 44px; font-size: 22px; }
.lb .nav:hover, .lb .x:hover { background: rgba(255,255,255,.26); }
.lb .nav { top: 50%; transform: translateY(-50%); }
.lb .prev { left: max(12px, env(safe-area-inset-left, 0px)); }
.lb .next { right: max(12px, env(safe-area-inset-right, 0px)); }
.lb .x { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: reduce) { .print { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>오유금❤️김윤영</h1>
      <p class="count" id="count"></p>
    </div>
    <div class="dday">
      <span class="n" id="ddayN">D+</span>
      <span class="l">2026년 10월 5일</span>
      <span class="next" id="ddayNext"></span>
    </div>
  </header>
  <main id="album">
    <div class="empty"><div class="big">앨범을 펼치는 중</div><p>사진을 불러오고 있어요.</p></div>
  </main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <img id="lbImg" alt="">
  <div class="txt"><div class="c" id="lbCap"></div><div class="d" id="lbDate"></div></div>
  <button class="nav prev" id="lbPrev" type="button" aria-label="이전 사진">‹</button>
  <button class="nav next" id="lbNext" type="button" aria-label="다음 사진">›</button>
  <button class="x" id="lbClose" type="button" aria-label="닫기">×</button>
</div>

<script>
/* ===== 여기만 바꾸면 돼요 ===== */
const MET_DAY = [2026, 10, 5];        // 처음 만난 날 (년, 월, 일)
const PHOTO_FOLDERS = ['', 'photos'];  // 사진을 찾을 폴더 ('' = 맨 위)
/* ============================ */

(() => {
  const $ = id => document.getElementById(id);
  const IMG = /\.(jpe?g|png|gif|webp|avif)$/i;
  let photos = [], open = -1;

  /* D+ 계산 */
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const met = new Date(MET_DAY[0], MET_DAY[1] - 1, MET_DAY[2]);
  const days = Math.round((today - met) / 86400000) + 1;
  $('ddayN').textContent = 'D+' + days.toLocaleString('ko-KR');
  const next = Math.ceil((days + 1) / 100) * 100;
  const yearN = Math.floor(days / 365) + 1;
  const ann = new Date(met); ann.setFullYear(met.getFullYear() + yearN);
  const annLeft = Math.round((ann - today) / 86400000);
  $('ddayNext').textContent = annLeft >= 0 && annLeft < next - days ? `${yearN}주년까지 ${annLeft}일` : `${next}일까지 ${next - days}일`;

  /* 파일 이름에서 날짜와 메모 읽기: "2026-10-12_한강 피크닉.jpg" */
  function fromName(name) {
    const base = name.replace(/\.[^.]+$/, '');
    let date = null, cap = base;
    const m = base.match(/^(\d{4})[-._]?(\d{2})[-._]?(\d{2})(?:[ _-]+(.*))?/);
    if (m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31) {
      date = `${m[1]}-${m[2]}-${m[3]}`;
      cap = m[4] || '';
    }
    // 카메라가 붙인 이름(IMG_1234, KakaoTalk_...)은 메모로 안 씀
    if (/^(img|dsc|pxl|kakaotalk|screenshot|photo|image|mvimg|p\d)/i.test(cap) || /^[\d_\-\s]+$/.test(cap)) cap = '';
    return { date, cap: cap.replace(/_/g, ' ').trim() };
  }

  async function exifDate(url) {
    try {
      const r = await fetch(url, { headers: { Range: 'bytes=0-131071' } });
      const v = new DataView(await r.arrayBuffer());
      if (v.getUint16(0) !== 0xFFD8) return null;
      let o = 2;
      while (o < v.byteLength - 4) {
        const mk = v.getUint16(o);
        if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          const t = o + 10, le = v.getUint16(t) === 0x4949;
          const g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
          const str = p => { let s = ''; for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(p + i)); return s; };
          let dt = null, ex = null;
          const scan = (ifd, wantExif) => {
            const n = g16(ifd);
            for (let i = 0; i < n; i++) {
              const e = ifd + 2 + i * 12, tag = g16(e);
              if (wantExif && tag === 0x8769) ex = t + g32(e + 8);
              if (tag === 0x0132 && !dt) dt = str(t + g32(e + 8));
              if (tag === 0x9003) dt = str(t + g32(e + 8));
            }
          };
          scan(t + g32(t + 4), true);
          if (ex) scan(ex, false);
          const m = dt && dt.match(/^(\d{4}):(\d{2}):(\d{2})/);
          return m && m[1] !== '0000' ? `${m[1]}-${m[2]}-${m[3]}` : null;
        }
        if ((mk & 0xFF00) !== 0xFF00) break;
        o += 2 + v.getUint16(o + 2);
      }
    } catch (e) {}
    return null;
  }

  /* GitHub 저장소 주소 알아내기: 아이디.github.io/저장소이름/ */
  function repoInfo() {
    const h = location.hostname.toLowerCase();
    if (!h.endsWith('.github.io')) return null;
    const owner = h.replace('.github.io', '');
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const isFile = seg && /\.html?$/i.test(seg);
    return { owner, repo: seg && !isFile ? seg : h, base: seg && !isFile ? `/${seg}/` : '/' };
  }

  async function listFolder(info, folder) {
    const r = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/contents/${folder}`, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) return [];
    if (!r.ok) throw new Error(String(r.status));
    const items = await r.json();
    return items.filter(x => x.type === 'file' && IMG.test(x.name)).map(x => ({ name: x.name, src: info.base + x.path.split('/').map(encodeURIComponent).join('/'), sha: x.sha }));
  }

  async function load() {
    const info = repoInfo();
    if (!info) {
      empty('GitHub에 올리면 사진이 보여요', '이 파일을 GitHub Pages에 올리고 같은 저장소에 사진을 넣으면, 여기에 달별로 모여요.');
      return;
    }
    let files;
    const key = 'album-list-v1';
    try { const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if (c && Date.now() - c.t < 5 * 60e3) files = c.files; } catch (e) {}
    if (!files) {
      try {
        files = (await Promise.all(PHOTO_FOLDERS.map(f => listFolder(info, f)))).flat();
        try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), files })); } catch (e) {}
      } catch (e) {
        empty('사진 목록을 못 불러왔어요', '잠시 후 새로고침해 주세요. GitHub가 한 시간에 열 수 있는 횟수를 넘었을 수도 있어요.');
        return;
      }
    }
    photos = files.map(f => ({ ...f, ...fromName(f.name) }));
    render();
    // 파일 이름에 날짜가 없으면 사진 속 촬영 날짜를 읽어 와요
    const need = photos.filter(p => !p.date && /\.jpe?g$/i.test(p.name));
    if (need.length) {
      const cacheKey = 'album-exif-v1';
      let cache = {};
      try { cache = JSON.parse(localStorage.getItem(cacheKey) || '{}'); } catch (e) {}
      for (let i = 0; i < need.length; i += 6) {
        await Promise.all(need.slice(i, i + 6).map(async p => {
          if (cache[p.sha] !== undefined) { p.date = cache[p.sha]; return; }
          p.date = await exifDate(p.src); cache[p.sha] = p.date;
        }));
      }
      try { localStorage.setItem(cacheKey, JSON.stringify(cache)); } catch (e) {}
      render();
    }
  }

  function empty(title, msg) {
    const root = $('album'); root.textContent = '';
    const e = document.createElement('div'); e.className = 'empty';
    const b = document.createElement('div'); b.className = 'big'; b.textContent = title;
    const p = document.createElement('p'); p.textContent = msg;
    e.append(b, p); root.append(e);
  }

  const tilt = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return ((Math.abs(h) % 7) - 3) * 0.7; };
  const korDate = s => { const [y, m, d] = s.split('-').map(Number); return `${y}년 ${m}월 ${d}일`; };

  function render() {
    photos.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.name.localeCompare(a.name));
    $('count').textContent = photos.length ? `사진 ${photos.length}장` : '';
    if (!photos.length) { empty('첫 사진을 올려 볼까요?', 'GitHub 저장소에 사진을 올리면 1~2분 뒤 여기에 나타나요.'); return; }
    const root = $('album'); root.textContent = '';
    const groups = new Map();
    photos.forEach((p, i) => { const k = (p.date || '0000-00').slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push([p, i]); });
    for (const [k, items] of groups) {
      const sec = document.createElement('section'); sec.className = 'month';
      const h = document.createElement('h2');
      h.textContent = k === '0000-00' ? '날짜 모름' : `${k.slice(0, 4)}. ${k.slice(5, 7)}`;
      const sm = document.createElement('small'); sm.textContent = `${items.length}장`; h.append(sm);
      const g = document.createElement('div'); g.className = 'grid';
      for (const [p, i] of items) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'print';
        b.style.setProperty('--tilt', tilt(p.name) + 'deg');
        b.setAttribute('aria-label', (p.cap || '사진') + ' 크게 보기');
        const ph = document.createElement('div'); ph.className = 'ph';
        const img = document.createElement('img'); img.loading = 'lazy'; img.decoding = 'async'; img.alt = p.cap; img.src = p.src;
        ph.append(img);
        const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = p.cap;
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = p.date ? p.date.slice(5).replace('-', '.') : '';
        b.append(ph, cap, meta);
        b.onclick = () => show(i);
        g.append(b);
      }
      sec.append(h, g); root.append(sec);
    }
  }

  function show(i) {
    open = (i + photos.length) % photos.length;
    const p = photos[open];
    $('lbImg').src = p.src; $('lbImg').alt = p.cap;
    $('lbCap').textContent = p.cap;
    $('lbDate').textContent = p.date ? korDate(p.date) : '';
    $('lbPrev').hidden = $('lbNext').hidden = photos.length < 2;
    if ($('lb').hidden) { $('lb').hidden = false; document.body.style.overflow = 'hidden'; $('lbClose').focus(); }
  }
  function close() { $('lb').hidden = true; open = -1; document.body.style.overflow = ''; }
  $('lbClose').onclick = close;
  $('lbPrev').onclick = () => show(open - 1);
  $('lbNext').onclick = () => show(open + 1);
  $('lb').addEventListener('click', e => { if (e.target.id === 'lb') close(); });
  document.addEventListener('keydown', e => {
    if ($('lb').hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(open - 1);
    if (e.key === 'ArrowRight') show(open + 1);
  });
  let tx = null;
  $('lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('lb').addEventListener('touchend', e => {
    if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) show(open + (dx < 0 ? 1 : -1));
  });

  load();
})();
</script>
</body>
</html>
